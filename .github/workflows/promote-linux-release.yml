name: Promote verified Linux release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Linux packages run ID
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA built by the source run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Verify source run and published release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.name' <<< "$run_json")" = 'Linux packages'
          test "$(jq -r '.conclusion' <<< "$run_json")" = 'success'
          test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$EXPECTED_SHA"
          test "$(gh release view v3.14.37 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = 'false'

      - name: Download verified package artifact
        uses: actions/download-artifact@v4
        with:
          name: zencode-linux-${{ matrix.arch }}
          path: release-linux-${{ matrix.arch }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify and promote packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=(release-linux-${{ matrix.arch }}/ZenCode-3.14.37-linux-${{ matrix.deb_arch }}.deb)
          rpm=(release-linux-${{ matrix.arch }}/ZenCode-3.14.37-linux-${{ matrix.rpm_arch }}.rpm)
          test -f "${deb[0]}"
          test -f "${rpm[0]}"
          node .github/scripts/promote-release-assets.mjs v3.14.37 "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${deb[0]}" "${rpm[0]}"
