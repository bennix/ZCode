name: Verify installed 3.14.26 release

on:
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: Successful Windows package run ID (leave empty for published release)
        required: false
        type: string
      linux_run_id:
        description: Successful Linux packages run ID (leave empty for published release)
        required: false
        type: string
      expected_sha:
        description: Full 40-character source SHA for candidate runs
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate candidate inputs and source runs
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          LINUX_RUN_ID: ${{ inputs.linux_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -z "$WINDOWS_RUN_ID" && -z "$LINUX_RUN_ID" && -z "$EXPECTED_SHA" ]]; then exit 0; fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$WINDOWS_RUN_ID" || -n "$LINUX_RUN_ID" ]]
          for entry in "Windows package:$WINDOWS_RUN_ID" "Linux packages:$LINUX_RUN_ID"; do
            name="${entry%%:*}"
            run_id="${entry##*:}"
            if [[ -z "$run_id" ]]; then continue; fi
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.name' <<< "$run_json")" = "$name"
            test "$(jq -r '.conclusion' <<< "$run_json")" = 'success'
            test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
            test "$(jq -r '.head_sha' <<< "$run_json")" = "$EXPECTED_SHA"
          done
  windows-installer:
    needs: validate-source
    if: ${{ inputs.expected_sha == '' || inputs.windows_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            sha256: 63e2f2009c512d668354bf8e402630627cabd70bb075ea87a8239cd1abedb8a9
          - runner: windows-11-arm
            arch: arm64
            sha256: 7b7801caf3a5b63b49b06edc3ae145f4a55137821ba7d9a5cef33b44491ff7f6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and verify published installer
        if: ${{ !inputs.windows_run_id }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'ZenCode-3.14.26-win-${{ matrix.arch }}.exe'
          gh release download v3.14.26 --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $installer = Join-Path $env:RUNNER_TEMP $asset
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.sha256 }}') { throw "Installer hash mismatch: $actual" }
      - name: Download candidate installer
        if: ${{ inputs.windows_run_id }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'zencode-windows-${{ matrix.arch }}' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $installer = Join-Path $env:RUNNER_TEMP 'ZenCode-3.14.26-win-${{ matrix.arch }}.exe'
          if (-not (Test-Path $installer)) { throw 'Candidate installer missing' }
          Write-Output "SHA256 $((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()) $installer"
      - name: Install and check first-use settings
        shell: pwsh
        env:
          ZENCODE_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/installed-first-use.png
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'ZenCode-3.14.26-win-${{ matrix.arch }}.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter ZenCode.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'Installed ZenCode.exe missing under user Programs' }
          $env:ZENCODE_PACKAGED_APP_PATH = $installed.FullName
          node --test packages/desktop/tests/computer-use-settings.e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed app E2E failed' }
      - name: Collect Windows installer crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          $installerLog = Join-Path $env:TEMP 'ZCode-installer.log'
          if (Test-Path $installerLog) {
            Write-Output 'Recent NSIS installer stages:'
            Get-Content $installerLog -Tail 80
          } else {
            Write-Output 'NSIS installer stage log missing'
          }
          $since = (Get-Date).AddMinutes(-20)
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since; Id = 1000,1001 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'ZenCode|ZenCode-3\\.14\\.26' } |
            Select-Object -First 5 TimeCreated, ProviderName, Id, Message |
            Format-List
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-windows-${{ matrix.arch }}-screenshot
          path: ${{ runner.temp }}/installed-first-use.png
          if-no-files-found: ignore

  linux-deb:
    needs: validate-source
    if: ${{ inputs.expected_sha == '' || inputs.linux_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            sha256: f92f2b1455be5c6d83975ee8123de7e52f36866745d0d06f3d11ec9f1eb08bd2
          - runner: ubuntu-24.04-arm
            arch: arm64
            sha256: 7df68923e38d153efec9b563be6b249ceab09a6c6dd83c5a9acb4e296657b843
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and verify published deb
        if: ${{ !inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ZenCode-3.14.26-linux-${{ matrix.arch }}.deb
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          gh release download v3.14.26 --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum --check -
      - name: Download candidate deb
        if: ${{ inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.linux_run_id }}
          ASSET: ZenCode-3.14.26-linux-${{ matrix.arch }}.deb
          ARTIFACT: zencode-linux-${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/$ASSET"
          sha256sum "$RUNNER_TEMP/$ASSET"
      - name: Install and check first-use settings
        env:
          ASSET: ZenCode-3.14.26-linux-${{ matrix.arch }}.deb
          ZENCODE_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/installed-first-use.png
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo apt-get install -y "$RUNNER_TEMP/$ASSET"
          test "$(dpkg-query -W -f='${Version}' zcode)" = '3.14.26'
          app="$(command -v zcode)"
          test -x "$app"
          ZENCODE_PACKAGED_APP_PATH="$app" ZENCODE_TEST_DISABLE_SANDBOX=1 xvfb-run -a node --test packages/desktop/tests/computer-use-settings.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-linux-deb-${{ matrix.arch }}-screenshot
          path: ${{ runner.temp }}/installed-first-use.png
          if-no-files-found: ignore

  linux-rpm:
    needs: validate-source
    if: ${{ inputs.expected_sha == '' || inputs.linux_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            sha256: 713e1027626cc189483590cf2bccd917d3f194fce745d11a0ff69509d5763c2c
          - runner: ubuntu-24.04-arm
            arch: aarch64
            sha256: 068d7af1ff550be850c8d351abf1d6a94872bb5af72c6f34630d49b447c10823
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Download and verify published rpm
        if: ${{ !inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ZenCode-3.14.26-linux-${{ matrix.arch }}.rpm
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          gh release download v3.14.26 --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum --check -
      - name: Download candidate rpm
        if: ${{ inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.linux_run_id }}
          ASSET: ZenCode-3.14.26-linux-${{ matrix.arch }}.rpm
          ARTIFACT: zencode-linux-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/$ASSET"
          sha256sum "$RUNNER_TEMP/$ASSET"
      - name: Install rpm in matching Fedora container
        env:
          ASSET: ZenCode-3.14.26-linux-${{ matrix.arch }}.rpm
        run: |
          docker run --rm -v "$RUNNER_TEMP/$ASSET:/tmp/zencode.rpm:ro" fedora:41 \
            bash -euc 'dnf install -y /tmp/zencode.rpm && rpm -q zcode && command -v zcode'
