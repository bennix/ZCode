name: Verify installed 3.14.37 release

on:
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: Successful Windows package run ID (leave empty for published release)
        required: false
        type: string
      linux_run_id:
        description: Successful Linux packages run ID (leave empty for published release)
        required: false
        type: string
      expected_sha:
        description: Full 40-character source SHA for candidate runs
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate candidate inputs and source runs
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          LINUX_RUN_ID: ${{ inputs.linux_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -z "$WINDOWS_RUN_ID" && -z "$LINUX_RUN_ID" && -z "$EXPECTED_SHA" ]]; then exit 0; fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$WINDOWS_RUN_ID" || -n "$LINUX_RUN_ID" ]]
          for entry in "Windows package:$WINDOWS_RUN_ID" "Linux packages:$LINUX_RUN_ID"; do
            name="${entry%%:*}"
            run_id="${entry##*:}"
            if [[ -z "$run_id" ]]; then continue; fi
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.name' <<< "$run_json")" = "$name"
            test "$(jq -r '.conclusion' <<< "$run_json")" = 'success'
            test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
            test "$(jq -r '.head_sha' <<< "$run_json")" = "$EXPECTED_SHA"
          done
  windows-installer:
    needs: validate-source
    if: ${{ inputs.expected_sha == '' || inputs.windows_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            sha256: b489c949e1c9a84f5dec5d9b743014091c3602367b4d323989b7ded29dbd6fd5
          - runner: windows-11-arm
            arch: arm64
            sha256: b4d5d69920b638df28b175c73c7241c72f7322c4cbe8518e4ed0da050fee5e75
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and verify published installer
        if: ${{ !inputs.windows_run_id }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'ZenCode-3.14.37-win-${{ matrix.arch }}.exe'
          gh release download v3.14.37 --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $installer = Join-Path $env:RUNNER_TEMP $asset
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.sha256 }}') { throw "Installer hash mismatch: $actual" }
      - name: Download candidate installer
        if: ${{ inputs.windows_run_id }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'zencode-windows-${{ matrix.arch }}' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $installer = Join-Path $env:RUNNER_TEMP 'ZenCode-3.14.37-win-${{ matrix.arch }}.exe'
          if (-not (Test-Path $installer)) { throw 'Candidate installer missing' }
          Write-Output "SHA256 $((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()) $installer"
      - name: Install and check first-use settings
        shell: pwsh
        env:
          ZENCODE_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/installed-first-use.png
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'ZenCode-3.14.37-win-${{ matrix.arch }}.exe'
          # 修复依据：System.dll 的偶发崩溃发生在 NSIS customInit 前；只靠阶段日志无法定位原生指令。
          # 一次性 runner 的 WER 小型转储用于失败取证，不能改变安装器原始退出码。
          $dumpDir = Join-Path $env:RUNNER_TEMP 'nsis-dumps'
          New-Item -ItemType Directory -Path $dumpDir -Force | Out-Null
          $dumpKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ZenCode-3.14.37-win-${{ matrix.arch }}.exe'
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter ZenCode.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'Installed ZenCode.exe missing under user Programs' }
          $env:ZENCODE_PACKAGED_APP_PATH = $installed.FullName
          node --test packages/desktop/tests/computer-use-settings.e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed app E2E failed' }
          node --test packages/desktop/tests/about-update-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed app update check failed' }
      - name: Collect Windows installer crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          $installerLog = Join-Path $env:TEMP 'ZCode-installer.log'
          if (Test-Path $installerLog) {
            Write-Output 'Recent NSIS installer stages:'
            Get-Content $installerLog -Tail 80
          } else {
            Write-Output 'NSIS installer stage log missing'
          }
          $dumpDir = Join-Path $env:RUNNER_TEMP 'nsis-dumps'
          if (Test-Path $dumpDir) {
            Get-ChildItem $dumpDir -Filter '*.dmp' | Select-Object Name, Length, LastWriteTime | Format-Table
          } else {
            Write-Output 'Windows Error Reporting dump directory missing'
          }
          $since = (Get-Date).AddMinutes(-20)
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since; Id = 1000,1001 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'ZenCode' } |
            Select-Object -First 5 TimeCreated, ProviderName, Id, Message |
            Format-List
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-windows-${{ matrix.arch }}-screenshot
          path: ${{ runner.temp }}/installed-first-use.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nsis-${{ matrix.arch }}-crash-dump
          path: ${{ runner.temp }}/nsis-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3

  linux-deb:
    needs: validate-source
    if: ${{ inputs.expected_sha == '' || inputs.linux_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            sha256: 82d9d7583d2b9c63aeed3afee09645e327d0705b744c3f7f9d9fd6c1b052337e
          - runner: ubuntu-24.04-arm
            arch: arm64
            sha256: e2ff9a63ee2b42253970684751d44bd19e962d9dde637b4676694c230cdaa602
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and verify published deb
        if: ${{ !inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ZenCode-3.14.37-linux-${{ matrix.arch }}.deb
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          gh release download v3.14.37 --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum --check -
      - name: Download candidate deb
        if: ${{ inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.linux_run_id }}
          ASSET: ZenCode-3.14.37-linux-${{ matrix.arch }}.deb
          ARTIFACT: zencode-linux-${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/$ASSET"
          sha256sum "$RUNNER_TEMP/$ASSET"
      - name: Install and check first-use settings
        env:
          ASSET: ZenCode-3.14.37-linux-${{ matrix.arch }}.deb
          ZENCODE_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/installed-first-use.png
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo apt-get install -y "$RUNNER_TEMP/$ASSET"
          test "$(dpkg-query -W -f='${Version}' zcode)" = '3.14.37'
          app="$(command -v zcode)"
          test -x "$app"
          ZENCODE_PACKAGED_APP_PATH="$app" ZENCODE_TEST_DISABLE_SANDBOX=1 xvfb-run -a node --test packages/desktop/tests/computer-use-settings.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-linux-deb-${{ matrix.arch }}-screenshot
          path: ${{ runner.temp }}/installed-first-use.png
          if-no-files-found: ignore

  linux-rpm:
    needs: validate-source
    if: ${{ inputs.expected_sha == '' || inputs.linux_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            sha256: 7cf7084bf4d1844821e6e03f3b26d307e8cff2be28263a760c1c0552b800458d
          - runner: ubuntu-24.04-arm
            arch: aarch64
            sha256: 89c72ec60c491c098f25e24726638d46b8db9644b3027e74eb7eea715c017920
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and verify published rpm
        if: ${{ !inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ZenCode-3.14.37-linux-${{ matrix.arch }}.rpm
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          gh release download v3.14.37 --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum --check -
      - name: Download candidate rpm
        if: ${{ inputs.linux_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.linux_run_id }}
          ASSET: ZenCode-3.14.37-linux-${{ matrix.arch }}.rpm
          ARTIFACT: zencode-linux-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/$ASSET"
          sha256sum "$RUNNER_TEMP/$ASSET"
      - name: Install rpm and check About in matching Fedora container
        env:
          ASSET: ZenCode-3.14.37-linux-${{ matrix.arch }}.rpm
        run: |
          docker run --rm --shm-size=1g \
            -v "$RUNNER_TEMP/$ASSET:/tmp/zencode.rpm:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace fedora:41 \
            bash -euc '
              dnf install -y /tmp/zencode.rpm nodejs xorg-x11-server-Xvfb
              rpm -q zcode
              app="$(command -v zcode)"
              test -x "$app"
              Xvfb :99 -ac -screen 0 1280x800x24 >/tmp/zencode-xvfb.log 2>&1 &
              trap "kill $! 2>/dev/null || true" EXIT
              export DISPLAY=:99
              sleep 2
              ZENCODE_PACKAGED_APP_PATH="$app" ZENCODE_TEST_DISABLE_SANDBOX=1 \
                node --test packages/desktop/tests/about-update-packaged.e2e.mjs
            '
