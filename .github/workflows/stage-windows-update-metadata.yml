name: Stage Windows update metadata

on:
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: Successful Windows package run ID
        required: true
        type: string
      expected_sha:
        description: Exact product source commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify source and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID")"
          test "$(jq -r '.name' <<< "$run_json")" = 'Windows package'
          test "$(jq -r '.conclusion' <<< "$run_json")" = 'success'
          test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$EXPECTED_SHA"
          release_json="$(gh release view v3.14.35 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          test "$(jq -r '.isDraft' <<< "$release_json")" = 'true'
          test "$(jq -r '.targetCommitish' <<< "$release_json")" = "$EXPECTED_SHA"

      - name: Download candidate installers
        uses: actions/download-artifact@v4
        with:
          pattern: zencode-windows-*
          path: installers
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}

      - name: Generate, upload, and verify latest.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, statSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const version = '3.14.35';
          const files = ['x64', 'arm64'].map((arch) => {
            const name = `ZenCode-${version}-win-${arch}.exe`;
            const path = join('installers', `zencode-windows-${arch}`, name);
            const sha512 = createHash('sha512').update(readFileSync(path)).digest('base64');
            return { name, sha512, size: statSync(path).size };
          });
          const lines = [`version: ${version}`, 'files:'];
          for (const file of files) lines.push(`  - url: ${file.name}`, `    sha512: ${file.sha512}`, `    size: ${file.size}`);
          lines.push(`path: ${files[0].name}`, `sha512: ${files[0].sha512}`, `releaseDate: ${new Date().toISOString()}`);
          writeFileSync('latest.yml', `${lines.join('\n')}\n`);
          NODE
          digest="sha256:$(sha256sum latest.yml | cut -d' ' -f1)"
          gh release upload v3.14.35 latest.yml --repo "$GITHUB_REPOSITORY"
          remote="$(gh release view v3.14.35 --repo "$GITHUB_REPOSITORY" --json assets | jq -r '[.assets[] | select(.name == "latest.yml") | .digest] | if length == 1 then .[0] else empty end')"
          test "$remote" = "$digest"
          echo "latest.yml $digest"
